{% load i18n %}
<div class="modal-overlay" id="confirmDialog">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">{% trans "Confirm Action" %}</h3>
            <button class="modal-close-btn" onclick="closeConfirmDialog()" aria-label="Close">
                <i class="fas fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body">
            <p>{{ message|default:"Are you sure you want to proceed?" }}</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeConfirmDialog()">{% trans "Cancel" %}</button>
            <form method="post" action="{{ action_url }}" style="display:inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">{{ confirm_text|default:"Delete" }}</button>
            </form>
        </div>
    </div>
</div>
