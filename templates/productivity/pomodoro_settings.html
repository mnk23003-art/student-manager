{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Pomodoro Settings" %} - Student Manager{% endblock %}
{% block content %}
<div class="page-header"><h1>{% trans "Pomodoro Settings" %}</h1></div>
<div class="card"><div class="card-body">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }} ({% trans "minutes" %})</label>
            {{ field }}
        </div>
        {% endfor %}
        <div class="form-actions">
            <a href="{% url 'productivity:view' %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
            <button type="submit" class="btn btn-primary">{% trans "Save" %}</button>
        </div>
    </form>
</div></div>
{% endblock %}
