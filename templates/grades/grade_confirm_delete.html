{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Delete Grade" %} - Student Manager{% endblock %}
{% block content %}
<div class="page-header"><h1>{% trans "Delete Grade" %}</h1></div>
<div class="card"><div class="card-body">
    <p>{% trans "Are you sure you want to delete this grade?" %}</p>
    <div class="form-actions">
        <a href="{% url 'grades:list' %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
        <form method="post" style="display:inline">{% csrf_token %}<button type="submit" class="btn btn-danger">{% trans "Delete" %}</button></form>
    </div>
</div></div>
{% endblock %}
