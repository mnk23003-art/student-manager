{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Email Sent" %} - Student Manager{% endblock %}
{% block auth_content %}
<div class="auth-card">
    <div class="auth-header">
        <i class="fas fa-envelope auth-logo"></i>
        <h1>{% trans "Check Your Email" %}</h1>
        <p>{% trans "We've sent password reset instructions to your email." %}</p>
    </div>
    <div class="auth-footer">
        <p><a href="{% url 'accounts:login' %}">{% trans "Back to Login" %}</a></p>
    </div>
</div>
{% endblock %}
