# ============================================================
# Nginx Security Configuration for Student Manager
# ============================================================
# Place in /etc/nginx/sites-available/student_manager
# Symlink to /etc/nginx/sites-enabled/

# Rate limiting zones
# Login: 5 req/s per IP, burst 10
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
# General API: 10 req/s per IP, burst 20
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# Upload: 2 req/s per IP, burst 5
limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Return 429 for rate limited requests
limit_req_status 429;
limit_conn_status 429;

# Block bad bots / scrapers
map $http_user_agent $bad_bot {
    default 0;
    ~*(bot|crawl|spider|scan|hack|curl|wget|python-requests|go-http-client) 1;
}

server {
    listen 80;
    server_name your_domain.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your_domain.com;

    # --- SSL (use Let's Encrypt or your certs) ---
    ssl_certificate /etc/letsencrypt/live/your_domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your_domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # --- Security Headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # --- Block bad bots ---
    if ($bad_bot) {
        return 403;
    }

    # --- Connection limits ---
    limit_conn conn_limit 50;

    # --- Client body size ---
    client_max_body_size 1M;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # --- Request limits ---
    limit_req zone=api burst=20 nodelay;

    # --- Static files (cached, no rate limit) ---
    location /static/ {
        alias /path/to/student_manager/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;

        # No rate limiting for static files
        limit_req off;
        limit_conn off;
    }

    # --- Favicon ---
    location /favicon.ico {
        alias /path/to/student_manager/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
        limit_req off;
    }

    # --- Login (strict rate limit) ---
    location /accounts/login/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Registration (strict rate limit) ---
    location /accounts/register/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Import/Upload (upload rate limit) ---
    location ~* ^/(core/import|import)/ {
        limit_req zone=upload burst=5 nodelay;
        client_max_body_size 1M;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- All other requests ---
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # --- Deny hidden files ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Deny backup files ---
    location ~* \.(bak|orig|save|swp|sql|sqlite3)$ {
        deny all;
    }
}
