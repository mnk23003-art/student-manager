services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./backups:/app/backups
      - ./logs:/app/logs
      - ./media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/accounts/login/')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/path/to/student_manager/staticfiles:ro
      - ./backups:/path/to/student_manager/backups:ro
      # SSL certs (Let's Encrypt)
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
